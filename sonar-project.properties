# sonar-project.properties
# Configuracion del analisis de envios-service.
# Nota: mvn sonar:sonar NO lee este archivo; el scanner de Maven usa las
# propiedades sonar.* del pom.xml. Este archivo queda para el SonarScanner CLI
# y como registro de la configuracion acordada (ver README).

# Identificacion del proyecto (debe coincidir con el creado en SonarQube)
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codigo de produccion, pruebas y bytecode compilado
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Cobertura: XML que genera JaCoCo en la fase verify
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusiones: ninguna. Todo el codigo de src/main/java es logica de negocio
# (Decision de diseño 2 en el README)
# sonar.exclusions=

# Servidor SonarQube local levantado con Docker
sonar.host.url=http://localhost:9000

# No bloquear el build esperando el Quality Gate; el resultado se revisa en el dashboard
sonar.qualitygate.wait=false
